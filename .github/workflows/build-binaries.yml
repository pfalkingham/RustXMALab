name: build-binaries

# Builds the programs for Linux, Windows and macOS: installers for Windows (setup
# program) and macOS (disk image with the app), an AppImage and a .deb for Linux,
# and portable archives of the bare programs for all three systems.
#
# It runs only when a tag named v* is pushed (for example v0.1.1), and then also
# makes a draft release on GitHub with all of them attached (publish it from the
# Releases page after checking), or when started by hand with "Run workflow" on
# the Actions page, which builds the downloads without a release. Pushes to
# master build nothing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Ubuntu 22.04, so the programs need glibc 2.35 or later (not the newer one of 24.04).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (X11/Wayland; FUSE for the AppImage tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libfuse2
      # The portable archive: programs, menu entry, README, LICENSE, NOTICE,
      # INSTALL.txt, THIRD-PARTY-LICENSES.txt and licenses/. Also writes
      # target/dist/THIRD-PARTY-LICENSES.txt, which the packages carry.
      - run: cargo xtask dist
      - run: cargo install cargo-packager --locked --version 0.11.8
      - name: AppImage and .deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          cargo packager --release --formats appimage,deb
          mkdir -p dist
          cp target/dist/rustxmalab-*-linux.tar.gz "dist/rustxmalab-${version}-x86_64-linux-portable.tar.gz"
          cp target/release/*.AppImage "dist/rustxmalab-${version}-x86_64-linux.AppImage"
          cp target/release/*.deb "dist/rustxmalab-${version}-x86_64-linux.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin rustxmalab --bin xma
      # Writes target/dist/THIRD-PARTY-LICENSES.txt, which both packages carry.
      - run: cargo xtask licenses
      - run: cargo install cargo-packager --locked --version 0.11.8
      - name: Setup program (cargo-packager, NSIS; installs into Program Files)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          cargo packager --release --formats nsis
          mkdir -p dist
          cp target/release/*-setup.exe "dist/rustxmalab-${version}-x86_64-windows-setup.exe"
      - name: Zip (the programs without installing)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          stem="rustxmalab-${version}-x86_64-windows-portable"
          mkdir -p "dist/$stem"
          cp target/release/rustxmalab.exe target/release/xma.exe README.md LICENSE NOTICE.md target/dist/THIRD-PARTY-LICENSES.txt "dist/$stem/"
          cp -r licenses "dist/$stem/"
          cd dist && 7z a -tzip "$stem.zip" "$stem" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  macos:
    runs-on: macos-15
    env:
      # Runs on macOS 11 (Big Sur) and later.
      RUSTFLAGS: "-C link-arg=-mmacosx-version-min=11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin --bin rustxmalab --bin xma
      # Writes target/dist/THIRD-PARTY-LICENSES.txt, which the bundle carries.
      - run: cargo xtask licenses
      - run: cargo install cargo-packager --locked --version 0.11.8
      # RustXMALab.app, with xma beside rustxmalab in Contents/MacOS.
      - run: cargo packager --release --target aarch64-apple-darwin --formats app
      # Ad-hoc signature: without an Apple Developer ID the app cannot be notarised,
      # but a signed bundle lets macOS offer "Open Anyway" instead of calling it damaged.
      - name: Sign ad hoc
        run: |
          app=target/aarch64-apple-darwin/release/RustXMALab.app
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Disk image
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p dist/dmg
          cp -R target/aarch64-apple-darwin/release/RustXMALab.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname RustXMALab -srcfolder dist/dmg -ov -format UDZO \
            "dist/rustxmalab-${version}-aarch64-macos.dmg"
      - name: Portable archive (the bare programs, without the app)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          stem="rustxmalab-${version}-aarch64-macos-portable"
          mkdir -p "dist/$stem"
          cp target/aarch64-apple-darwin/release/rustxmalab target/aarch64-apple-darwin/release/xma "dist/$stem/"
          cp README.md LICENSE NOTICE.md target/dist/THIRD-PARTY-LICENSES.txt "dist/$stem/"
          cp -r licenses "dist/$stem/"
          tar -czf "dist/$stem.tar.gz" -C dist "$stem"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      # Each file is attached on its own, as a direct download.
      - name: Check the seven downloads
        run: |
          ls -l downloads
          for pattern in '*-windows-setup.exe' '*-windows-portable.zip' '*-macos.dmg' \
                         '*-macos-portable.tar.gz' '*-linux.AppImage' '*-linux.deb' \
                         '*-linux-portable.tar.gz'; do
            n=$(find downloads -maxdepth 1 -name "$pattern" | wc -l)
            [ "$n" -eq 1 ] || { echo "expected one $pattern, found $n"; exit 1; }
          done
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          | System | Installer | Portable (unpack and run) |
          |---|---|---|
          | Windows, 64-bit | `...-windows-setup.exe` | `...-windows-portable.zip` |
          | macOS, Apple Silicon, macOS 11 or later | `...-macos.dmg` | `...-macos-portable.tar.gz` |
          | Linux, 64-bit, glibc 2.35 or later | `...-linux.AppImage`, or `...-linux.deb` for Ubuntu and Debian | `...-linux-portable.tar.gz` |

          The installers are not yet signed, so Windows and macOS warn the first time;
          the README's Download section says how to get past it. What is new is in
          CHANGELOG.md.
          NOTES
          gh release create "$GITHUB_REF_NAME" downloads/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "RustXMALab ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md

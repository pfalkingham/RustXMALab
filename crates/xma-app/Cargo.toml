[package]
name = "xma-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "xma_app"
path = "src/lib.rs"

[[bin]]
name = "rustxmalab"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
xma-engine.workspace = true
xma-model.workspace = true
xma-video.workspace = true
xma-vision.workspace = true
eframe.workspace = true
# egui's own emoji fonts: its colour picker labels a button with one (parity ledger U139).
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_tiles.workspace = true
egui_plot.workspace = true
rfd.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
bytemuck.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
xma-oracle.workspace = true

# Installers made by cargo-packager in CI (.github/workflows/build-binaries.yml):
# the macOS application bundle and the Windows setup program. Paths are relative
# to this folder. `cargo xtask licenses` writes target/dist/THIRD-PARTY-LICENSES.txt
# before packaging.
[package.metadata.packager]
product-name = "RustXMALab"
identifier = "io.github.pfalkingham.rustxmalab"
publisher = "Peter Falkingham"
authors = ["Peter Falkingham"]
description = "Marker tracking and 3D reconstruction from X-ray video (XROMM)"
homepage = "https://github.com/pfalkingham/RustXMALab"
copyright = "Copyright Peter Falkingham. Based on XMALab, copyright Brown University. GPL-3.0-only."
category = "Education"
license-file = "../../LICENSE"
icons = ["assets/icons/RustXMALab-Icon.png", "assets/icons/RustXMALab.icns"]
resources = [
    "../../README.md",
    "../../LICENSE",
    "../../NOTICE.md",
    "../../licenses",
    "../../target/dist/THIRD-PARTY-LICENSES.txt",
]

[[package.metadata.packager.binaries]]
path = "rustxmalab"
main = true

[[package.metadata.packager.binaries]]
path = "xma"
main = false

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "assets/icons/RustXMALab.ico"

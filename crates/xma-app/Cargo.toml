[package]
name = "xma-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "xma_app"
path = "src/lib.rs"

[[bin]]
name = "rustxmalab"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
xma-engine.workspace = true
xma-model.workspace = true
xma-video.workspace = true
xma-vision.workspace = true
eframe.workspace = true
# egui's own emoji fonts: its colour picker labels a button with one (parity ledger U139).
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_tiles.workspace = true
egui_plot.workspace = true
rfd.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
bytemuck.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
xma-oracle.workspace = true
